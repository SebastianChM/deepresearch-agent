[project]
name = "deepresearch-agent"
version = "0.1.0"
description = "Research agent that plans, searches, reads and synthesizes web sources into a cited Markdown report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sebastian" }]

dependencies = [
    "langgraph>=0.2.50",
    "langchain-openai>=0.2.0",
    "openai>=1.50.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "streamlit>=1.39",
    "tenacity>=9.0",
    "structlog>=24.4",
    "tiktoken>=0.8",
    "jinja2>=3.1",
    "markdown>=3.7",
    "xhtml2pdf>=0.2.16",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "vcrpy>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepresearch"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C90", "SIM", "RUF", "UP", "ARG", "PTH"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]
"src/deepresearch/agent/prompts.py" = ["E501"]
"app/streamlit_app.py" = ["E501", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["trafilatura.*", "vcr.*", "xhtml2pdf.*", "markdown.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/deepresearch"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
